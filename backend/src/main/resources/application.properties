spring.application.name=backend

# Load optional local environment file (backend/.env)
spring.config.import=optional:file:.env[.properties]

# Server
server.port=${SERVER_PORT:8080}

# API base path for REST controllers
spring.mvc.servlet.path=${API_BASE_PATH:/api}

# MySQL connection
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/micasita?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.MySQLDialect}

# JWT
app.jwt.secret=${JWT_SECRET:change-this-jwt-secret-min-32-chars}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}
