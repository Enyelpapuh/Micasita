spring.application.name=backend

# Load optional local environment file from backend/.env or workspace-root/backend/.env
spring.config.import=optional:file:.env[.properties],optional:file:backend/.env[.properties]

# Server
server.port=${SERVER_PORT:8080}

# API base path for REST controllers
spring.mvc.servlet.path=${API_BASE_PATH:/api}

# SQL Server connection
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=micasita;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:com.microsoft.sqlserver.jdbc.SQLServerDriver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:none}
spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:true}
spring.jpa.database-platform=${JPA_DIALECT:org.hibernate.dialect.SQLServerDialect}

# Flyway
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}

# JWT
app.jwt.secret=${JWT_SECRET:change-this-jwt-secret-min-32-chars}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:480}

# Uploads
app.upload.talleres-dir=${TALLERES_UPLOAD_DIR:uploads/talleres}
app.upload.talleres-max-bytes=${TALLERES_UPLOAD_MAX_BYTES:5242880}
app.upload.anuncios-dir=${ANUNCIOS_UPLOAD_DIR:uploads/anuncios}
app.upload.anuncios-max-bytes=${ANUNCIOS_UPLOAD_MAX_BYTES:5242880}
